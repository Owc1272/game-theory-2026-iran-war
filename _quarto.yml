project:
  type: website
  output-dir: _site
  resources:
    - "data/**"
    - "assets/**"

metadata-files:
  - glossary.yml

filters:
  - filters/gloss.lua

website:
  title: "Game Theory of the 2026 Iran War"
  description: "A modular game-theoretic analysis of the 2026 US–Israel war on Iran. Primer, timelines, twelve analyses, and a section on disagreements."
  site-url: ""    # populated after Pages is enabled
  repo-url: ""    # populated after repo is pushed
  navbar:
    background: dark
    search: true
    pinned: true
    left:
      - text: "Primer"
        href: primer/index.qmd
      - text: "Historical roots"
        menu:
          - text: "Overview — pre-1979 Iran and the 2026 war"
            href: historical-roots/index.qmd
          - text: "Theology and theocracy — the Khameneist project"
            href: historical-roots/theology.qmd
          - text: "The reformist-failure base rate (1905-2026)"
            href: historical-roots/reformist-failure-base-rate.qmd
          - text: "The trust-deficit lineage (1813-2026)"
            href: historical-roots/trust-deficit.qmd
      - text: "Timelines"
        href: timelines/index.qmd
      - text: "Analyses"
        href: analyses/index.qmd
      - text: "Disagreements"
        href: disagreements/index.qmd
      - text: "Glossary"
        href: glossary.qmd
    right:
      - icon: github
        href: ""    # populated after repo is pushed
        aria-label: "GitHub repository"
  page-footer:
    border: true
    left: |
      Game Theory of the 2026 Iran War — primer, timelines, analyses.
    right: |
      Built with [Quarto](https://quarto.org/) + [Closeread](https://closeread.dev/).
  sidebar:
    - id: primer
      title: "Primer"
      style: floating
      collapse-level: 2
      contents:
        - primer/index.qmd
        - text: "The bargaining model of war"
          href: primer/bargaining-model.qmd
        - text: "Audience costs and signaling resolve"
          href: primer/audience-costs.qmd
        - text: "Hierarchy and clientelism"
          href: primer/hierarchy-clientelism.qmd
        - text: "Omnibalancing and regime survival"
          href: primer/omnibalancing.qmd
        - text: "Hedging vs balancing vs bandwagoning"
          href: primer/hedging-balancing-bandwagoning.qmd
        - text: "Two-level games"
          href: primer/two-level-games.qmd
        - text: "Strategic ambiguity and threats that leave something to chance"
          href: primer/schelling-strategic-ambiguity.qmd
        - text: "Coalition theory and selectorate"
          href: primer/coalition-theory-selectorate.qmd
        - text: "Endogenous power shifts"
          href: primer/endogenous-power-shifts.qmd
        - text: "Khameneism and theological foreclosure"
          href: primer/khameneism-and-theological-foreclosure.qmd
    - id: historical-roots
      title: "Historical roots"
      style: floating
      collapse-level: 2
      contents:
        - historical-roots/index.qmd
        - text: "Theology and theocracy — the Khameneist project"
          href: historical-roots/theology.qmd
        - text: "The reformist-failure base rate (1905-2026)"
          href: historical-roots/reformist-failure-base-rate.qmd
        - text: "The trust-deficit lineage (1813-2026)"
          href: historical-roots/trust-deficit.qmd
    - id: timelines
      title: "Timelines"
      style: floating
      collapse-level: 2
      contents:
        - timelines/index.qmd
    - id: analyses
      title: "Analyses"
      style: floating
      collapse-level: 2
      contents:
        - analyses/index.qmd
        - text: "Q1 — Why bargaining failed"
          href: analyses/q1-why-bargaining-failed.qmd
        - text: "Q2 — Why the war has persisted"
          href: analyses/q2-war-persistence.qmd
        - text: "Q3 — Why the ceasefire is unstable"
          href: analyses/q3-ceasefire-instability.qmd
        - text: "Q4 — Can the US-led counter-blockade restore Hormuz transit?"
          href: analyses/q4-blockade-feasibility.qmd
        - text: "Q5 — Is the bargaining range empty?"
          href: analyses/q5-bargaining-range.qmd
        - text: "Q6 — What ends the war?"
          href: analyses/q6-what-ends-the-war.qmd
        - text: "Q7 — Russia in Ukraine"
          href: analyses/q7-russia-ukraine.qmd
        - text: "Q8 — China vis-à-vis Taiwan"
          href: analyses/q8-china-taiwan.qmd
        - text: "Q9 — Europe-US relationship"
          href: analyses/q9-europe-us-relationship.qmd
        - text: "Q10 — US Hormuz structural interest"
          href: analyses/q10-us-hormuz-interest.qmd
        - text: "Q11 — US-Israel coalition structure"
          href: analyses/q11-us-israel-coalition.qmd
        - section: "Q12 — Gulf states"
          contents:
            - analyses/q12-4-gulf-paradox.qmd
            - text: "Q12.5 — Post-war reconfiguration"
              href: analyses/q12-5-post-war-reconfiguration.qmd
    - id: disagreements
      title: "Disagreements"
      style: floating
      collapse-level: 2
      contents:
        - disagreements/index.qmd
        - text: "Iran's strategy — deterrent or coercive?"
          href: disagreements/iran-strategy-deterrent-vs-coercive.qmd

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    code-link: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-responsive: true
    include-in-header:
      - file: _includes/in-header.html
    include-after-body:
      - file: _includes/after-body.html
    grid:
      sidebar-width: 280px
      body-width: 820px
      margin-width: 240px
      gutter-width: 1.5rem

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/chicago-author-date.csl

execute:
  freeze: auto
  echo: false
  warning: false
