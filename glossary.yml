# Glossary entries — keyed by id. Each entry has a title and a ~100-word body.
# Optional `primer:` field links to the corresponding primer chapter once written.
# This file is included as project metadata via `metadata-files` in _quarto.yml,
# making `meta.glossary` accessible to the Lua filter at filters/gloss.lua.
#
# Usage in any .qmd: `[term text shown to reader]{.gloss data-gloss="id"}`

glossary:

  - id: olson-zeckhauser
    title: "Free-rider hypothesis (Olson & Zeckhauser, 1966)"
    body: |
      In 1966 Mancur Olson and Richard Zeckhauser argued that alliances behave like clubs sharing a public good: once provided, every member benefits whether they paid or not, so small members rationally let larger members carry the cost. The classic example is NATO during the Cold War — the US provided most of the defense, smaller European allies under-contributed. The model assumes alliance members are formal equals and the security benefit can't be withheld from any member. Where those assumptions break — for instance, in patron-client hierarchies — the prediction of free-riding can mislead. Q12.4 argues this is the wrong frame for Gulf-US relations.
    primer: null

  - id: lake-hierarchy
    title: "Hierarchy / patron-client (Lake, 2009; Posen)"
    body: |
      David Lake's *Hierarchy in International Relations* (2009) argues many "alliances" are not between equals. The small state cedes some authority — over basing rights, foreign-policy alignment, weapons procurement — in exchange for security from the large state. The relationship is hierarchical and reciprocal: the patron is constrained by what it can demand without violating the implicit bargain. Barry Posen's parallel "patron-client" framing makes the same point. This frame predicts client states can resist patron action when patron requests damage client interests. Saudi airspace denial in 2026 fits the prediction. It is the right frame for Gulf-US relations.
    primer: null

  - id: omnibalancing
    title: "Omnibalancing (David, 1991; Gause, 2003/4)"
    body: |
      Steven David's "Explaining Third World Alignment" (1991) argues leaders of fragile states face two threats — external and internal — and balance against whichever is larger. F. Gregory Gause's 2003/4 "Balancing What?" applies this to the Gulf: Sunni monarchies ruling restive Shia populations face a domestic balancing problem alongside any external one. Visible alignment with a Sunni-Shia regional war can mobilize domestic Shia constituencies, so participating can be regime-suicide for monarchies whose stability depends on accommodation. The framework explains why Bahrain (about 70% Shia under Sunni rule) is the most domestically constrained Gulf state on confrontation with Iran.
    primer: null

  - id: schelling-something-to-chance
    title: "Threat that leaves something to chance (Schelling)"
    body: |
      From Thomas Schelling's *The Strategy of Conflict* (1960) and *Arms and Influence* (1966): a threat that leaves the outcome partly to chance — by deploying force in ways neither side can fully control — coerces the adversary into concessions to avoid random escalation. The mechanism trades certainty for credibility: precisely *because* the threatener cannot guarantee restraint, the threat cannot be safely ignored. Q12.4 reads Iran's pattern of strikes on every GCC capital — regardless of contribution — through this lens: not retaliation deterrence (which would target only contributors) but offensive coercive escalation aimed at breaking GCC collective-action capacity.
    primer: null

  - id: bayesian-posterior
    title: "Bayesian posterior probability"
    body: |
      A Bayesian posterior is the probability you assign to a proposition after updating from your prior estimate using new evidence. Throughout this site, claims about mechanisms are stated as posteriors over configurations rather than single declarations of "the cause." For example: P(Mechanism 0 is load-bearing | evidence) = 0.65 means that after weighing all the evidence, the analyst's best estimate is a 65% chance Mechanism 0 explains the puzzle. Reporting probabilities forces honest uncertainty and makes claims testable — as new evidence arrives, posteriors shift in predictable directions, and the framework itself is falsifiable.
    primer: null

  - id: bargaining-range
    title: "Bargaining range"
    body: |
      The bargaining range is the set of settlements that *both* sides strictly prefer to war. Geometrically, imagine a line from 0 to 1 representing the contested issue (e.g., share of disputed territory, percentage enrichment allowed). Each side has a *reservation utility* — the worst settlement they'd accept rather than fight. Iran's reservation utility puts a floor on what it will accept; the US-Israel coalition's puts a ceiling on what it will offer. If Iran's floor is below the US ceiling, there's a range between them where both sides prefer to settle. If Iran's floor is above the US ceiling, the range is empty and war is rational for at least one side. The size of the range depends on the cost of war: bigger war costs widen the range; smaller costs (or anticipated future power shifts) collapse it.
    primer: primer/bargaining-model.qmd

  - id: issue-indivisibility
    title: "Issue indivisibility (Fearon, 1995 mechanism 3)"
    body: |
      Issue indivisibility is the third of James Fearon's (1995) three rationalist mechanisms for war (the others are private information and commitment problems). It applies when the contested issue *cannot* be physically or politically divided into a settlement — when "splitting the difference" is unavailable. The canonical examples are sovereign control of a holy site or a capital city. Quantities that look numerically divisible can become *politically* indivisible when constituted as sovereignty or identity claims: Tehran has framed enrichment as constitutive of Iranian state identity since 2003, making "0 % enrichment for 12 years" categorically unacceptable even though enrichment percentage is technically a continuous variable. See [Q1](analyses/q1-why-bargaining-failed.qmd) for the role in 2026.
    primer: primer/bargaining-model.qmd

  - id: powell-commitment
    title: "Commitment problem (Powell, 2006)"
    body: |
      Robert Powell's "War as a Commitment Problem" (2006) argues that war happens when one side expects a future power shift the other side cannot credibly commit *not* to exploit. Even when both sides would prefer today's deal, the side that's about to gain power cannot bind its future self to the deal — so the declining side may strike now rather than be coerced later. Applied to Iran 2026, the question is whether Iran's potential nuclear acquisition was the textbook discontinuous shift Powell describes — or whether Iran's offered verification regime was, in fact, a Powell-style monitoring fix that the US/Israel chose not to accept.
    primer: null

  - id: principal-agent-slippage
    title: "Principal-agent severe slippage (Hawkins, Lake, Nielson, Tierney, 2006)"
    body: |
      The principal-agent framework analyzes relationships where one actor (the *principal*) delegates authority to another (the *agent*) and the agent develops autonomy that the principal cannot easily revoke. *Severe agency slippage* (Hawkins, Lake, Nielson, Tierney 2006) occurs when four conditions combine: (1) the principal delegates for specialization or credible-commitment reasons, (2) imperfect monitoring creates *slack*, (3) the agent's preferences *drift* from the principal's, and (4) the principal is itself a heterogeneous coalition with collective-action problems disciplining the agent. The framework predicts the relationship persists until the principal's cost of disciplining the agent falls below the cost of continued accommodation. Applied to the 2026 US-Israel coalition in [Q11](analyses/q11-us-israel-coalition.qmd) as one of several competing structural readings.
    primer: null

  - id: stackelberg-leader-follower
    title: "Stackelberg leader-follower"
    body: |
      A Stackelberg game is one where one player (the leader) moves first and the other (the follower) optimizes given that move. Originally a model of duopoly competition, the structure applies any time one actor sets the agenda and another adapts to a fait accompli. Applied to the US-Israel coalition in 2026, a Stackelberg reading says Israel led: the December 2025 Mar-a-Lago lobbying, the Stage 0 deterrent-layer degradation, the Situation Room war presentation, and especially Khamenei's assassination (a regime-change act much harder to read as US bargaining than Israeli fait accompli) all fit Israel-as-leader / US-as-follower-with-veto-attempted.
    primer: null

  - id: octopus-doctrine
    title: "Octopus Doctrine (Bennett, 2018)"
    body: |
      The Octopus Doctrine, traceable to Naftali Bennett (2018), reframed Israeli strategy from "cut the head" (decapitating Iran's leadership) to "cut the arms first, then the head" — systematically degrading Iran's regional proxy network (Hezbollah, Hamas, Houthis, Iraqi/Syrian militias) before any direct strike on Iran itself. The doctrine survived three Israeli governments — operationalized by Lapid, institutionalized by Netanyahu after October 2023. Stage 0 of the 2026 war (October 2023 → June 2025 systematic degradation) is the doctrine in execution. It is a Likud-right doctrine specifically, not pan-Israeli — the IDF General Staff pragmatist tradition opposed it through 2010-2012 but was systematically dismantled 2024-25.
    primer: null

  - id: audience-costs-fearon
    title: "Audience costs (Fearon, 1994; Weeks, 2008)"
    body: |
      James Fearon's "Domestic Political Audiences and the Escalation of International Disputes" (1994) argues that leaders pay political costs at home for backing down from public commitments. These "audience costs" make threats more credible — bigger public commitments cost more to retreat from. Democratic leaders typically face higher audience costs than autocrats. Jessica Weeks (2008) extends the analysis to autocratic regimes: where institutional elites coordinate around a position, autocrats can also generate audience costs internally. By late February 2026, both Trump (publicly committed via repeated threats) and the IRGC institutional consensus (committed to enrichment-on-soil) had passed their backdown thresholds.
    primer: null

  - id: irgc-bonyad-complex
    title: "IRGC-bonyad complex"
    body: |
      The Islamic Revolutionary Guard Corps (IRGC) is Iran's parallel military force — separate from the regular army (Artesh), reporting directly to the Supreme Leader, and operating an autonomous foreign-operations branch (the Quds Force) and economic empire. The bonyads are Iran's network of state-linked economic foundations controlling large fractions of the non-oil economy and operating outside Western financial sanctions. Together they form the structural counterparty in any nuclear negotiation: the formal president (Pezeshkian) cannot deliver concessions the IRGC won't accept, and the bonyads cannot be sanctioned into compliance. By March 2026 Iran was "de facto under IRGC military rule" per ICG Crisis Monitor #4 — Vahidi controlled negotiations, Pezeshkian was sidelined.
    primer: null

  - id: hokayem-battle-of-endurance
    title: "Battle of endurance / asymmetric audience costs (Hokayem, IISS)"
    body: |
      Emile Hokayem (International Institute for Strategic Studies, 2026) argues the 2026 Iran war is a *battle of endurance* in which one side's bargaining floor is set by the other's most vulnerable domestic constituency. For the IRGC, war is existential — regime survival depends on never publicly accepting US-imposed terms. For most Americans, war is discretionary and "best over and forgotten" — Trump's political cost from sustained war rises faster than the IRGC's cost from sustained war. The asymmetry locks in stalemate: Iran can outlast US public opinion on attrition; the US cannot outlast the IRGC on existential calculus. The bargaining range cannot close because each side's reservation utility is set by the other side's weakest point.
    primer: null

  - id: phased-mou-subgame-fix
    title: "Phased MOU / Powell-style subgame fix"
    body: |
      A *phased MOU* (memorandum of understanding) separates an agreement's immediate-period commitments (e.g., reopen Hormuz, formalize ceasefire) from its future-period commitments (nuclear restraint, missile curbs, reparations). The technique is the canonical [Powell-style commitment fix]{.gloss data-gloss="powell-commitment"}: each side commits to what it can today, while the categorically unresolvable issues are pushed forward to later phases when bargaining geometry may differ. The fix works when the shadow of the future is long enough to bind future commitments. In May 2026, a Hormuz-first phased MOU is technically accessible — but Hokayem's asymmetric audience costs mean neither side can credibly stay in the iterated game on terms acceptable to the other, so any MOU is a deferral mechanism, not a range expansion.
    primer: null

  - id: atlantic-council-scenarios
    title: "Atlantic Council 4-scenario typology"
    body: |
      The Atlantic Council's 2026 post-Iran-war scenario analysis (Cimmino & Pavel) sets out four scenarios indexed by two dimensions — US action intensity (limited vs. decisive) and Chinese engagement (passive vs. active). **Scenario 1 — Managed Erosion of US Primacy:** limited US action + passive China = "uneasy, inconclusive peace" with periodic violations; Iran retains regime and some toll capacity. **Scenario 2 — Strategic Windfall for Beijing:** limited US + active China = China consolidates as Middle East security broker. **Scenario 3 — Reassertion of US Primacy:** decisive US action + passive China = full IRGC degradation or regime change. **Scenario 4 — Great-Power Inflection Point:** decisive US + active China = two-front (Iran + Taiwan) confrontation. The AC assesses Scenario 1 as most likely.
    primer: null

  - id: vukovic-nash-equilibrium
    title: "Nash equilibrium nobody wants but stable (Vukovic, 2026)"
    body: |
      Predrag Vukovic (Oraclum, March 2026) argues the 2026 Iran war is converging on a Nash equilibrium that "nobody wants but is stable." Three equilibrium outcomes are possible — negotiated settlement, regime change, protracted stalemate — and the third is the Nash equilibrium because "the player who appears most willing to absorb mutual destruction gains leverage." Iran's IRGC-dominated leadership has explicitly adopted this posture. The outcome is *stable* in the game-theoretic sense (no player can unilaterally improve by deviating) but *bad* for everyone (mutual losses compared to settlement). The framing is the canonical analyst language for the May 2026 state and overlaps tightly with Hokayem's battle of endurance.
    primer: null

  - id: ibish-post-war-retaliation-risk
    title: "Post-war retaliation risk (Ibish, 2026)"
    body: |
      Hussein Ibish (Arab Gulf States Institute in Washington) argued in March 2026 that Sunni Gulf monarchies face one asymmetric calculation about post-war Iran. If Iran is "weakened but not destroyed," it will retaliate against accessible Gulf targets — so the Gulf wants Iran finished. But visible alignment with the war raises future target priority for an Iran that does survive — so the monarchies push the war privately while declining to be the public platform for it. Both halves of the Q12.4 paradox come from this single forward-looking calculus. Ibish's account replaces the multi-mechanism reconciliation as the load-bearing explanation.
    primer: null

  - id: vision-2030
    title: "Vision 2030 (Saudi Arabia, 2016–)"
    body: |
      Saudi Arabia's Vision 2030, announced by Crown Prince Mohammed bin Salman in 2016, is a state-led plan to diversify the kingdom's economy away from oil dependence — through tourism, entertainment, technology, and showcase mega-projects like NEOM (a planned $500 billion futuristic city). The plan requires sustained foreign direct investment, expert expatriate labor, and a stable regional security environment. Visible escalation against Iran threatens all three: investors flee, expat professionals leave, tourism collapses if missiles are flying. Q12.4 treats Vision 2030 not as Saudi rhetoric but as a binding economic constraint that pulled MBS from hawkish-by-default toward off-ramp-seeking once 2026 war costs became tangible.
    primer: null

  - id: yemen-lesson
    title: "The Yemen lesson (Saudi-led intervention, 2015–)"
    body: |
      In March 2015, Saudi Arabia led a regional coalition into Yemen aiming to defeat the Houthis and restore the Hadi government. After seven years of inconclusive war the Houthis still controlled Sanaa and most population centers; the Saudi-led campaign failed to achieve its strategic objectives despite vastly superior firepower. Gulf monarchies internalized the lesson: a Gulf-led regional war that the GCC cannot definitively finish becomes an existential trap. The lesson is widely cited in MENA-studies sources as the dominant Saudi internal explanation for restraint on direct Iran combat in 2026 — and is one of four secondary mechanisms shaping Gulf wartime behavior.
    primer: null

  - id: saudi-iran-2023-rapprochement
    title: "China-brokered Saudi-Iran rapprochement (10 March 2023)"
    body: |
      On 10 March 2023 Saudi Arabia and Iran announced restored diplomatic relations after seven years of severed ties, with China as the broker. The deal reopened embassies, restored travel, and committed both sides to non-interference. The rapprochement signaled three things at once: Saudi acceptance that confrontation with Iran was no longer cost-effective; Beijing's emergence as a regional security broker alongside Washington; and Riyadh's willingness to hedge between the two great powers. Q12.4 treats the 2023 deal as standing diplomatic infrastructure that constrained Saudi war participation in 2026 — torching it would have lost Beijing's good will and the hedging option.
    primer: null

  - id: kydd-biased-mediator
    title: "Biased-mediator theorem (Kydd, 2003)"
    body: |
      Andrew Kydd's "Which Side Are You On? Bias in International Mediation" (2003) argues counterintuitively that biased mediators can be MORE effective than neutral ones. A neutral mediator must persuade both sides that any deal is fair; a biased mediator credibly conveys to one side that the deal — even though it favors the other — is the best available, because the mediator would have no reason to oversell on its disfavored side's behalf. Q12.4 reads Oman's 2026 mediation through this lens: Oman's long-standing closeness to Iran makes its messages to Tehran more credible than any neutral state's could be.
    primer: null

  - id: source-confidence-tier
    title: "Source-confidence tier (T1 / T2 / T3 / T4)"
    body: |
      Every load-bearing claim on this site carries a tier badge. T1 means multi-source verified — independent corroboration from at least two sources of different type (e.g., a wire report plus a peer-reviewed analysis). T2 means single-source named — reported by one named source, not yet independently corroborated. T3 means inference from evidence — a reading of empirical evidence under a chosen analytical framework, where the factual base is solid but the inferential leap is the analyst's. T4 means conjecture — a hypothesis not yet supported by named source or strong inference.
    primer: null

  - id: walt-balance-of-threat
    title: "Balance-of-threat (Walt, 1987)"
    body: |
      Stephen Walt's *The Origins of Alliances* (1987) refined classical balance-of-power theory: states do not balance against power as such, but against the most threatening combination of capability, geographic proximity, offensive intent, and aggressive doctrine. The framework allows a small or middle state facing an unreliable patron to form *alternative* alliance structures rather than simply hedge or bandwagon — which is exactly what Q12.5 reads in Saudi Arabia's post-war moves (Pakistan defense treaty, Turkey procurement, preserved Iran channel). The framework adds an alliance-formation prediction that the looser "hedging" language obscures.
    primer: null

  - id: snyder-abandonment-entrapment
    title: "Abandonment vs entrapment (Snyder, 1984)"
    body: |
      Glenn Snyder's "The Security Dilemma in Alliance Politics" (1984) argues that every alliance creates two opposing risks for its members: *abandonment* (the partner declines to fight when needed) and *entrapment* (the partner drags you into a fight you would have avoided). Small partners manage abandonment risk by securing alternative deterrence backstops; large partners manage entrapment risk by constraining the junior. Under multipolar conditions where abandonment risk is acute — Trump-era patron unreliability for the Gulf monarchies in 2026 is the canonical case — Snyder predicts the small partner will construct alternative architecture rather than passively hedge.
    primer: null

  - id: lim-cooper-hedging
    title: "Lim & Cooper hedging discipline (2015)"
    body: |
      Daniel Lim and Zack Cooper's "Reassessing Hedging" (2015) imposed definitional discipline on the loose "hedging" language pervasive in great-power-competition writing. True hedging requires three signals: visible cost-incurring trade-offs (not cheap rhetoric), strategic ambiguity (not commitment to one pole), and credible second-best options. Many states described as "hedging" are actually bandwagoning with the structurally locked-in patron because they have no alternative. Q12.5 applies the test to the Gulf states and finds a bimodal split: Bahrain and Kuwait are bandwagoners (no alternative); Saudi/UAE/Qatar/Oman are true hedgers (real options), but each in distinct ways.
    primer: null

  - id: fulton-alignment
    title: "Interest-based alignment-deepening (Fulton, 2026)"
    body: |
      Jonathan Fulton (*State of Great Power Competition in the Gulf*, 2026) argues against the standard "Gulf-states-are-hedging" reading. His claim is that GCC states are *interest-based alignment-deepeners* with the US, not wait-and-see hedgers — they have *deepened* US security ties (CSIPA, expanded basing, joint air defense) precisely because the US has proved reliable in crisis. The framework predicts that subordinate states in a stable hierarchy do not hedge; they double down when the patron has demonstrated commitment. Q12.5 finds Fulton's reading correct for Bahrain (operational bandwagoning) but partial-only for Saudi, where third-pole construction is visible alongside US-deepening.
    primer: null

  - id: saudi-pakistan-smda
    title: "Saudi-Pakistan SMDA (September 2025)"
    body: |
      The Saudi-Pakistan Strategic Mutual Defence Agreement, signed September 2025, is a formal alliance treaty — not a generic defense-cooperation MoU. It establishes mutual-defense obligations and commits both states to coordinate strategic-asset deployment; the implicit reach to Pakistan's nuclear umbrella is the most consequential feature. The agreement pre-dates the 2026 war but was operationalized post-war (April-May 2026 saw $3bn Saudi debt relief to Pakistan plus accelerated Saudi-Turkey KAAN fighter procurement). The SMDA is the load-bearing evidence for Q12.5's Configuration F (Saudi-led Sunni-Muslim third pole) — Lim-Cooper's hedging definitional discipline explicitly excludes treaty-level commitments, so this is alliance formation, not hedging.
    primer: null

  - id: bahrain-csipa
    title: "Bahrain CSIPA Article II invocation (5 March 2026)"
    body: |
      The US-Bahrain Comprehensive Security Integration and Prosperity Agreement (CSIPA), signed in 2023, includes Article II provisions for mutual consultation on major security threats. Its 5 March 2026 invocation — the first ever — triggered senior-level Defense Working Group consultations and UK joining via RAF Typhoon deployment to Bahrain. Combined with Bahrain's leadership of a 135-state UN Security Council resolution on Iran and 160+ IRGC-linked detentions inside Bahrain, the invocation is Q12.5's strongest single piece of evidence that *some* Gulf states are operationally bandwagoning with the US, not rhetorically hedging. Bahrain is the leading indicator for the Configuration A pattern.
    primer: null

  - id: friedberg-win-without-fighting
    title: "Win without fighting (Friedberg, 2011)"
    body: |
      Aaron Friedberg's *A Contest for Supremacy* (2011) argued that China's grand strategy is to displace the United States as the leading power in Asia while avoiding direct military confrontation — to "win without fighting." The strategy combines strategic patience, asymmetric leverage, regional asymmetric coalition-building, and quiet capability development. The framework explicitly integrates economic statecraft, capability-building, and opportunistic tactical wins as components of a single posture. Q8 reads China's 2026 behavior — strategic ADIZ pause, Trump-Xi summit pursuit, CIPS / blocking-statute structural moves, continued PLA platform development — as Friedberg's strategy in execution rather than as Chinese retreat or weakness.
    primer: null

  - id: brands-beckley-peaking-power
    title: "Peaking-power thesis (Brands & Beckley, 2022)"
    body: |
      Hal Brands and Michael Beckley's *Danger Zone* (2022) argue that China is a peaking power: its long-term growth, demographic, and technological trajectories are flattening, while US capacity in key dimensions is poised to recover or compound. Peaking powers face a use-it-or-lose-it pressure to act before their window closes — but the thesis also allows for peaking-power *patience* when the window remains open and the cost of premature action is high. Q8 finds Brands-Beckley patience overlays Friedberg's strategy in 2026: China extracts non-kinetic gains while the window holds rather than accelerating toward a kinetic Taiwan operation it cannot execute before 2027-28.
    primer: null

  - id: biddle-modern-system
    title: "Modern-system combined arms (Biddle, 2004)"
    body: |
      Stephen Biddle's *Military Power* (2004) argues that modern combat effectiveness depends less on raw force ratios or technology than on a "modern system" of cover, concealment, suppression, and combined-arms integration that requires functioning command structures, sustained doctrine, and continuous training cycles. Force structure that looks formidable on paper but lacks combined-arms execution will under-perform sharply. Q8 reads PLA capability after Zhang Youxia / Liu Zhenli / 73rd Group Army purges through this lens: platform development continues (Type 076, Type 055) but combined-arms execution is bounded through 2027-28, foreclosing near-term Taiwan operational options.
    primer: null

  - id: yarhi-milo-selective-attention
    title: "Selective attention to resolve signals (Yarhi-Milo, 2014)"
    body: |
      Keren Yarhi-Milo's *Knowing the Adversary* (2014) shows that leaders update their assessments of foreign-state resolve through a strongly selective filter shaped by prior beliefs, bureaucratic position, and theater-specific priors — not through Bayesian processing of all available signals. A leader anchored on "this adversary is different in my theater" will discount strong resolve signals from other theaters. Q8 applies the framework to Xi's reading of the Trump-Iran preventive strike: Xi updates substantially on US-Iran-resolve but the same observation produces only a bounded, ambiguous update on US-Taiwan-resolve — different theater, different selective-attention frame.
    primer: null

  - id: goemans-gamble-resurrection
    title: "Gamble for resurrection (Goemans, 2000)"
    body: |
      Hein Goemans's *War and Punishment* (2000) argues that leaders of mixed regimes — autocrats with some accountability, but not democratic exit guarantees — face a distinct war-termination calculus. If losing the war means losing power and possibly life, the leader prefers escalation over a moderately bad settlement even when objective war prospects worsen. The framework predicts continued war-prosecution past the point where objective interests would dictate concession. Q7 reads Putin's 2026 behavior — rejected mediation offers, Levada drop, parade truncation, hard-line rhetoric, doubled glide-bomb output — as Goemans's gamble-for-resurrection in execution. The framework dominates the Reiter/Fearon settlement-pressure prediction on current evidence.
    primer: null

  - id: colgan-petrostate
    title: "Revolutionary petrostate aggression (Colgan, 2013)"
    body: |
      Jeff Colgan's *Petro-Aggression* (2013) refined the petrostate-aggression literature by separating *revolutionary* petrostates (those whose leadership came to power through revolutionary upheaval and faces external regime-survival threats) from *non-revolutionary* ones. Revolutionary petrostates use oil rents to project power abroad; non-revolutionary petrostates do not. The framework matters in Q7 because it classifies modern Russia as *non-revolutionary*: Putin's regime is not Iran-style revolutionary, so Russia's oil revenue gains are best read through Drezner-sanctions and Ross-volatility lenses (transactional, decay-prone) rather than as petrostate-aggression fuel.
    primer: null

  - id: drezner-sanctions
    title: "Sanctions don't coerce (Drezner, 1999 / 2025)"
    body: |
      Daniel Drezner's *The Sanctions Paradox* (1999) and his updated 2025 reassessment argue that sanctions rarely succeed at extracting territorial or political concessions from a target state. Their function is mostly sovereignty-signaling (the sender demonstrates non-acceptance) plus slow capacity-degradation, not coercion in the strict sense. The framework matters in Q7 because it shows why Trump's sanctions-relaxation moves are rationally consistent with continued US opposition to Russia: the relaxations do not give Russia anything sanctions were extracting, because sanctions were not coercive to begin with. The framework also predicts Russia's oil-revenue gains will not buy Ukraine concessions.
    primer: null

  - id: pressman-alliance-restraint
    title: "Alliance restraint of junior partner (Pressman, 2008)"
    body: |
      Jeremy Pressman's *Warring Friends* (2008) argues that within asymmetric alliances, the senior partner can restrain the junior partner from initiating war, but only when three conditions hold: the senior credibly threatens to withhold support, the junior values the alliance more than the prospective conflict, and the senior actually attempts restraint rather than enabling. Where any condition fails, restraint fails. Q7 uses the framework to explain why the loose CRINK (China-Russia-Iran-North Korea) coalition produced no Russia-Ukraine concessions during the 2026 Iran war: there is no senior partner with the leverage to deliver concessions, and the partners' interests in restraining each other are too weak.
    primer: null

  - id: farrell-newman-interdependence
    title: "Weaponized interdependence (Farrell & Newman, 2019)"
    body: |
      Henry Farrell and Abraham Newman's "Weaponized Interdependence" (2019) showed that asymmetric network structures — financial messaging (SWIFT), payment systems (USD clearing), data infrastructure — give the state controlling chokepoints coercive leverage independent of military power. The framework predicts that states facing chokepoint coercion will build alternative architecture (renminbi clearing, BRICS+ payment rails) over time. Q7 reads China's May 2026 MOFCOM blocking statute as one major datapoint in this gradual shift; Q8 reads CIPS daily volume reaching ~$134B as another. The framework underlies the "passive vs active gains" asymmetry between Russia and Ukraine.
    primer: null

  - id: mearsheimer-attrition
    title: "Attrition-vs-blitzkrieg multi-front constraint (Mearsheimer, 1983; Posen, 1984)"
    body: |
      John Mearsheimer's *Conventional Deterrence* (1983) distinguished blitzkrieg (rapid decisive offense) from attrition (slow grinding) and argued the blitzkrieg option is highly conditional on operational concentration. Barry Posen's *Sources of Military Doctrine* (1984) extended the framework to show how multi-front pressure forces a state into attrition doctrine and constrains force generation. Q7 applies the joint framework to Russia in 2026: deep-strike degradation of refining/C4ISR/storage feedstock plus continued Ukrainian defense-dominance forces Russia into a sustained attrition posture it can no longer afford, with first net territory loss since August 2024 confirming the dynamic.
    primer: null

  - id: pape-coercion
    title: "Coercion by punishment vs denial (Pape, 1996)"
    body: |
      Robert Pape's *Bombing to Win* (1996) distinguished *punishment* coercion (raising civilian costs to pressure regimes) from *denial* coercion (defeating the adversary's military strategy on the battlefield) and argued denial generally outperforms punishment. The framework matters in Q7 because Ukraine's deep-strike campaign against Russian refineries and C4ISR feedstock plants is Pape's denial logic inverted: a defender using strategic strike to deny the aggressor the material base for sustained offense. The framework predicts deep-strike effectiveness compounds with each round of refinery destruction, which matches the empirical trajectory through May 2026.
    primer: null

  - id: weeks-autocratic
    title: "Autocratic audience costs (Weeks, 2008; 2014)"
    body: |
      Jessica Weeks's "Autocratic Audience Costs" (2008) and *Dictators at War and Peace* (2014) extended Fearon's audience-cost framework to non-democracies. Her finding: autocrats with coordinated institutional elites (Politburos, ruling parties, military councils) can generate internal audience costs as binding as democratic ones; autocrats without such institutions (personalist dictators) cannot. The framework matters in this site's analyses because the IRGC institutional consensus on enrichment-on-soil functions as Weeks's elite-coordinated audience: Pezeshkian as the formal president cannot back down without imposing intolerable costs inside the institutional elite that ultimately controls the Iranian state.
    primer: null

  - id: two-level-games
    title: "Two-level games (Putnam, 1988)"
    body: |
      Robert Putnam's "Diplomacy and Domestic Politics: The Logic of Two-Level Games" (1988) modeled international negotiations as occurring simultaneously on two boards. On Level I, lead negotiators bargain abroad; on Level II, the resulting agreement must be ratified by domestic constituencies. The negotiation's *win-set* is the intersection of Level-II-acceptable agreements on both sides. When Level-II win-sets do not overlap, no Level-I agreement can stick — even if both lead negotiators want a deal. The framework is the standard fix for the bargaining model's "binding agreements possible" assumption: it lets analysts model audience costs and veto-player dynamics as constraints on what Level-I bargains can survive ratification.
    primer: null

  - id: hesder-pipeline
    title: "Hesder yeshiva officer pipeline"
    body: |
      Hesder yeshivas are religious-Zionist seminaries that combine Talmudic study with IDF combat service through a five-year program. Their graduates feed disproportionately into combat-officer schools: by the mid-2020s, Hesder alumni and the broader religious-Zionist demographic supplied roughly a third of IDF infantry officers and around half of combat-officer school graduates. The pipeline progressively shifts the IDF officer corps from the historically secular-pragmatist Ashkenazi tradition toward a religious-Zionist-aligned cohort. The site treats the pipeline as one component of the structural lock-in of Israel's hawkish posture beyond any single Netanyahu coalition.
    primer: null

  - id: configuration-f-saudi-third-pole
    title: "Configuration F — Saudi-led Sunni-Muslim third pole"
    body: |
      Configuration F is Q12.5's most distinctive finding: a post-war Gulf in which Saudi Arabia constructs an alternative security architecture in parallel to (not necessarily in opposition to) the US-Israel-led one. The components: the formal Saudi-Pakistan Strategic Mutual Defence Agreement (September 2025), accelerated Saudi-Turkey defense procurement (KAAN fighter deal), preserved bilateral channels with Iran (Hajj coordination, embassy intact), and explicit US-independence signaling (denial of Project Freedom airspace, May 2026). Configuration F is generated by Walt balance-of-threat plus Snyder abandonment-anxiety under acute multipolar conditions. Posterior probability ≈ 0.40 — the most likely single system-level descriptor.
    primer: null

  - id: bahrain-test
    title: "The Bahrain test"
    body: |
      The Bahrain test asks: is Bahrain's post-28-February-2026 behavior more consistent with operational bandwagoning with the US or with rhetorical hedging? The behaviors observable: CSIPA Article II invocation (5 March), leadership of the 135-state UNSC resolution, RAF Typhoon deployment hosting, and 160+ IRGC-linked internal detentions. Bandwagoning predicts all four; hedging predicts none of them. The test is the single cleanest discriminator between Lim-Cooper's bimodal-strict reading (some Gulf states bandwagon, others hedge) and Kuik's broad uniform-hedger reading. Bahrain's behavior decisively confirms the bimodal-strict reading.
    primer: null
